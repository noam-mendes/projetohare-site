name: Publicar site completo

on:
  schedule:
    # 06/08/2026 às 18:00 em Brasília
    - cron: "0 21 6 8 *"

  workflow_dispatch:
    inputs:
      modo:
        description: "O que esta execução deve fazer?"
        required: true
        default: "testar"
        type: choice
        options:
          - testar
          - publicar

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Confirmar a data do lançamento
        if: github.event_name == 'schedule'
        run: |
          DATA_ATUAL=$(date -u +%Y-%m-%d)

          if [ "$DATA_ATUAL" != "2026-08-06" ]; then
            echo "Esta automação só deve publicar o site em 06/08/2026."
            exit 1
          fi

      - name: Verificar arquivos
        run: |
          test -f index.html
          test -f site.html

          echo "index.html encontrado."
          echo "site.html encontrado."
          echo "Estrutura pronta para publicação."

      - name: Encerrar teste seguro
        if: github.event_name == 'workflow_dispatch' && inputs.modo == 'testar'
        run: |
          echo "Teste concluído."
          echo "Nenhum arquivo foi alterado."
          echo "Nenhum commit foi criado."

      - name: Substituir landing pelo site completo
        if: github.event_name == 'schedule' || inputs.modo == 'publicar'
        run: |
          cp site.html index.html

      - name: Salvar alteração no repositório
        if: github.event_name == 'schedule' || inputs.modo == 'publicar'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "O site completo já está publicado."
            exit 0
          fi

          git commit -m "Publica site completo automaticamente"
          git push origin main